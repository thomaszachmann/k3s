# S3-kompatibler Objektspeicher für Thanos, Loki, Tempo und Velero auf k3s-obs.
# Buckets: thanos, loki, tempo, backup (create-buckets.sh).
# Konten und Secrets: create-secrets.sh, muss VOR diesem Manifest laufen,
# weil das Deployment das Secret s3-config einbindet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # local-path setzt diese Größe NICHT durch. Das echte Limit setzen die
      # weed-Flags unten: 120 Volumes zu je 256 MB, also rund 30 GB.
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: monitoring
  labels:
    app: s3
spec:
  replicas: 1
  # RWO-Volume und ein Datenverzeichnis mit LevelDB-Sperre:
  # niemals zwei Pods gleichzeitig, deshalb Recreate statt RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      # Kubernetes würde für den Service "s3" die Variable S3_PORT=tcp://<ip>:8333
      # setzen. SeaweedFS liest Flags auch aus der Umgebung, hält das für
      # -s3.port und stürzt ab. Deshalb bleiben diese Altlast-Variablen aus.
      enableServiceLinks: false
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.52
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            # Jeder Bucket ist eine eigene Collection und belegt beim ersten
            # Schreiben gleich mehrere Volumes. Vier Buckets brauchen daher
            # deutlich mehr als vier Volumes.
            - -master.volumeSizeLimitMB=256
            - -volume.max=120
            - -volume.minFreeSpace=2GiB
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3-data
        - name: config
          secret:
            secretName: s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: monitoring
  labels:
    app: s3
spec:
  selector:
    app: s3
  ports:
    - name: s3
      port: 8333
      targetPort: s3
