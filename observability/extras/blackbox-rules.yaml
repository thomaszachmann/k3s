# Alarme aus dem Blackbox-Exporter. Lokal auf obs ausgewertet: Sie sollen
# auch dann feuern, wenn Thanos gerade nicht antwortet.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox
  namespace: monitoring
  labels:
    auswertung: lokal
spec:
  groups:
    - name: blackbox
      rules:
        - alert: EndpunktNichtErreichbar
          expr: probe_success{job="blackbox"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} antwortet nicht wie erwartet"
        - alert: ZertifikatLaeuftBaldAb
          expr: (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 30
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Zertifikat von {{ $labels.instance }} laeuft in {{ $value | humanize }} Tagen ab"
        - alert: ZertifikatLaeuftSehrBaldAb
          expr: (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 7
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Zertifikat von {{ $labels.instance }} laeuft in {{ $value | humanize }} Tagen ab"
