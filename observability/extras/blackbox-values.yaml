# Blackbox-Exporter auf obs (Chart prometheus-community/prometheus-blackbox-exporter 11.21.1).
# Prueft die Endpunkte unter *.obs.internal von aussen: DNS, TLS, HTTP-Status.

config:
  modules:
    # Erwartet 2xx, zum Beispiel von https://grafana.obs.internal/api/health.
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        preferred_ip_protocol: ip4
        fail_if_not_ssl: true
        tls_config:
          ca_file: /etc/obs-ca/ca.crt
    # Hinter Basic Auth: 401 heisst "Ingress und TLS funktionieren".
    http_basic_auth:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 401]
        preferred_ip_protocol: ip4
        fail_if_not_ssl: true
        tls_config:
          ca_file: /etc/obs-ca/ca.crt

# Die eigene CA aus Kapitel 2 (ConfigMap obs-ca, Schluessel ca.crt).
extraConfigmapMounts:
  - name: obs-ca
    mountPath: /etc/obs-ca
    configMap: obs-ca
    readOnly: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
