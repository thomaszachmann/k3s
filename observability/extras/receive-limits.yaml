# Schreib-Limits fuer Thanos Receive pro Mandant. Wird als Datei in den
# Receive-Pod eingehaengt und mit --receive.limits-config-file geladen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-receive-limits
  namespace: monitoring
data:
  limits.yaml: |
    write:
      global:
        max_concurrency: 30
      default:
        request:
          # Mehr Serien oder Samples pro Remote-Write-Anfrage -> HTTP 413.
          series_limit: 5000
          samples_limit: 20000
          size_bytes_limit: 0
      tenants:
        obs:
          request:
            series_limit: 0
            samples_limit: 0
