# Meta-Monitoring: Ueberwacht die Ueberwachung. Ausgewertet vom Thanos Ruler.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: meta-monitoring
  namespace: monitoring
  labels:
    auswertung: global
spec:
  groups:
    - name: meta-monitoring
      rules:
        # Ein Cluster, der vor einer Stunde noch Daten geschickt hat, ist verstummt.
        - alert: ClusterSchweigt
          expr: |
            group by (cluster) (up offset 1h)
              unless
            group by (cluster) (up)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Vom Cluster {{ $labels.cluster }} kommen keine Metriken mehr an"
        # Thanos Receive lehnt Schreibanfragen ab (4xx/5xx).
        - alert: ReceiveLehntAb
          expr: |
            sum by (code) (rate(http_requests_total{job=~".*thanos-receive.*", handler="receive", code=~"4..|5.."}[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Thanos Receive antwortet mit HTTP {{ $labels.code }}"
        # Der Compactor hat aufgegeben und raeumt nicht mehr auf.
        - alert: ThanosCompactorAngehalten
          expr: thanos_compact_halted == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Thanos Compactor ist angehalten (halted)"
