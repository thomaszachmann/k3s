# Datenquelle Tempo (Kapitel 9). Der Grafana-Sidecar liest jede ConfigMap
# mit dem Label grafana_datasource: "1" im Namespace monitoring.
# Der Header X-Scope-OrgID "obs|app1|app2" fragt alle drei Mandanten ab.
# In Provisioning-Dateien steht $$ für ein einzelnes $.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ds-tempo
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc:3200
        editable: false
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          # Von einer Span zu den Logs desselben Pods springen.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            tags:
              - key: cluster
                value: cluster
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
          # Von einer Span zu den Span-Metriken in Thanos.
          tracesToMetrics:
            datasourceUid: thanos
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - key: service.name
                value: service
              - key: cluster
                value: cluster
            queries:
              - name: Anfragerate
                query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          # Service-Graph aus den Metriken des Metrics-Generators.
          serviceMap:
            datasourceUid: thanos
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
        secureJsonData:
          httpHeaderValue1: obs|app1|app2
