# Datenquelle Loki (Kapitel 8). Der Grafana-Sidecar liest jede ConfigMap
# mit dem Label grafana_datasource: "1" im Namespace monitoring.
# Der Header X-Scope-OrgID "obs|app1|app2" fragt alle drei Mandanten ab.
# In Provisioning-Dateien steht $$ für ein einzelnes $.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ds-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false
        jsonData:
          maxLines: 1000
          httpHeaderName1: X-Scope-OrgID
          # Aus einer Log-Zeile mit trace_id einen Link zu Tempo machen.
          derivedFields:
            - name: TraceID
              matcherType: regex
              matcherRegex: 'trace_?id"?[=:]\s*"?(\w+)'
              datasourceUid: tempo
              url: '$${__value.raw}'
              urlDisplayLabel: Trace in Tempo öffnen
        secureJsonData:
          httpHeaderValue1: obs|app1|app2
