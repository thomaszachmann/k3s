# Sammelt die Metriken aller Thanos-Komponenten ein. Das Label job entspricht
# dem Service-Namen (thanos-receive, thanos-query, thanos-store, thanos-compact).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: thanos
  endpoints:
    - port: http
      interval: 30s
