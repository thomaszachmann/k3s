# Thanos Compactor: fasst kleine Blöcke in S3 zusammen, rechnet sie herunter
# (Downsampling) und löscht nach Ablauf der Aufbewahrung.
# Genau eine Instanz pro Bucket: zwei Compactors würden die Daten beschädigen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compact
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-compact
    app.kubernetes.io/part-of: thanos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compact
        app.kubernetes.io/part-of: thanos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos-compact
          image: quay.io/thanos/thanos:v0.42.5
          args:
            - compact
            - --log.level=info
            - --wait
            - --wait-interval=5m
            - --data-dir=/data
            - --http-address=0.0.0.0:10902
            - --objstore.config-file=/etc/thanos/objstore.yml
            # Aufbewahrung je Auflösung: Rohdaten 30 Tage, 5-Minuten-Werte
            # 90 Tage, 1-Stunden-Werte ein Jahr.
            - --retention.resolution-raw=30d
            - --retention.resolution-5m=90d
            - --retention.resolution-1h=365d
            - --delete-delay=1h
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            # Arbeitsverzeichnis: der Compactor lädt Blöcke zum Bearbeiten herunter.
            sizeLimit: 10Gi
        - name: objstore
          secret:
            secretName: thanos-objstore
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-compact
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-compact
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    app.kubernetes.io/name: thanos-compact
  ports:
    - name: http
      port: 10902
      targetPort: http
