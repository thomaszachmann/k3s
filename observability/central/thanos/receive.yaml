# Thanos Receive: nimmt Remote Write von allen Clustern an, speichert die
# Daten ein paar Stunden lokal und lädt alle zwei Stunden Blöcke nach S3.
# Eine Replika arbeitet als Router und Ingestor zugleich.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-receive-hashring
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-receive
data:
  # Der Hashring enthält genau einen Knoten: diesen Pod selbst.
  # Der Eintrag muss exakt zu --receive.local-endpoint passen.
  hashrings.json: |
    [
      {
        "hashring": "default",
        "endpoints": [
          "thanos-receive-0.thanos-receive.monitoring.svc.cluster.local:10901"
        ]
      }
    ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-receive
    app.kubernetes.io/part-of: thanos
spec:
  replicas: 1
  serviceName: thanos-receive
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-receive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-receive
        app.kubernetes.io/part-of: thanos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Receive schreibt beim Beenden den Kopfblock weg. Das braucht Zeit.
      terminationGracePeriodSeconds: 120
      containers:
        - name: thanos-receive
          image: quay.io/thanos/thanos:v0.42.5
          args:
            - receive
            - --log.level=info
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --remote-write.address=0.0.0.0:19291
            - --tsdb.path=/data
            # Lokal nur kurz halten, ältere Daten liefert der Store aus S3.
            - --tsdb.retention=6h
            # Exemplars (Trace-IDs an Messwerten) aufbewahren, pro Mandant.
            - --tsdb.max-exemplars=100000
            - --objstore.config-file=/etc/thanos/objstore.yml
            # Mandanten: Header THANOS-TENANT -> Label tenant_id.
            - --receive.tenant-header=THANOS-TENANT
            - --receive.tenant-label-name=tenant_id
            - --receive.default-tenant-id=unbekannt
            # Router und Ingestor in einem Prozess.
            - --receive.hashrings-file=/etc/thanos-hashring/hashrings.json
            - --receive.local-endpoint=thanos-receive-0.thanos-receive.monitoring.svc.cluster.local:10901
            - --receive.replication-factor=1
            # Externes Label dieser Replika. Thanos Query entfernt es beim Deduplizieren.
            - --label=receive_replica="0"
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
            - name: remote-write
              containerPort: 19291
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
            - name: hashring
              mountPath: /etc/thanos-hashring
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
        - name: hashring
          configMap:
            name: thanos-receive-hashring
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            # local-path setzt die Größe nicht durch, sie dient als Merkposten.
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-receive
    app.kubernetes.io/part-of: thanos
spec:
  # Headless: liefert den DNS-Namen thanos-receive-0.thanos-receive...
  # für den Hashring, und Thanos Query findet den Pod per "dns+".
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-receive
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
    - name: remote-write
      port: 19291
      targetPort: remote-write
