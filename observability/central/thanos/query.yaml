# Thanos Query: verteilt PromQL an Receive (frische Daten), Store (Daten in S3)
# und Thanos Ruler (ALERTS und Regel-Ergebnisse) und entfernt Duplikate.
# Liefert außerdem die Web-Oberfläche.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-query
    app.kubernetes.io/part-of: thanos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-query
        app.kubernetes.io/part-of: thanos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos-query
          image: quay.io/thanos/thanos:v0.42.5
          args:
            - query
            - --log.level=info
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            # Labels, die nur die Replika unterscheiden. Query fasst solche
            # Serien zu einer zusammen.
            - --query.replica-label=receive_replica
            - --query.replica-label=prometheus_replica
            - --query.replica-label=thanos_ruler_replica
            # Receive und Store: headless, per A-Record ("dns+").
            # Thanos Ruler: Operator-Service, per SRV-Record ("dnssrv+").
            - |-
              --endpoint.sd-config=endpoints:
                - address: dns+thanos-receive.monitoring.svc.cluster.local:10901
                - address: dns+thanos-store.monitoring.svc.cluster.local:10901
                - address: dnssrv+_grpc._tcp.thanos-ruler-operated.monitoring.svc.cluster.local
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos-query
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    app.kubernetes.io/name: thanos-query
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
