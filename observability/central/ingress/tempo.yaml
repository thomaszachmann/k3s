# OTLP/HTTP-Traces der Cluster an Tempo. Der Service tempo entsteht erst in Kapitel 9.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo
  namespace: monitoring
  annotations:
    # Nur HTTPS, und nur mit Basic Auth.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-obs-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tempo.obs.internal
      secretName: obs-tls
  rules:
    - host: tempo.obs.internal
      http:
        paths:
          # Nur der Schreibpfad ist von außen erreichbar, Lesen bleibt intern.
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 4318
