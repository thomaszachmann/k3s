# Erzeugt pro Mandant eine ConfigMap mit denselben Log-Alarmen (Kapitel 8).
# Der Regel-Sidecar im Loki-Pod findet sie über das Label loki_rule und legt
# sie nach /rules/<loki_rule_folder>/ ab. Der Ordnername ist der Mandant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    loki_rule: "1"

configMapGenerator:
  - name: loki-regeln-obs
    files: [log-alarme.yaml]
    options:
      annotations: {loki_rule_folder: obs}
  - name: loki-regeln-app1
    files: [log-alarme.yaml]
    options:
      annotations: {loki_rule_folder: app1}
  - name: loki-regeln-app2
    files: [log-alarme.yaml]
    options:
      annotations: {loki_rule_folder: app2}
