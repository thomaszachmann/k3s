# Cilium 1.20.4 für den Single-Node-Cluster k3s2
# Passt zu /etc/rancher/k3s/config.yaml (flannel-backend: none, disable-kube-proxy: true)

# Ohne kube-proxy funktioniert die Service-IP 10.43.0.1 erst, wenn Cilium läuft.
# Deshalb spricht der Agent den API-Server direkt an.
k8sServiceHost: 172.16.0.136
k8sServicePort: 6443
kubeProxyReplacement: true

# Muss zu cluster-cidr in der k3s-Konfiguration passen.
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16

# Ein Node, also reicht ein Operator.
operator:
  replicas: 1

# Macht den Netzwerkverkehr sichtbar, bevor Default-Deny eingeführt wird.
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
