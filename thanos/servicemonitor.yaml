# Scrapes all Thanos components. The job label equals the service name
# (thanos-query, thanos-store, thanos-compact), which the dashboards rely on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: thanos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: thanos
  endpoints:
    - port: http
      interval: 30s
